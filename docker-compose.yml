services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: teacheraid-postgres
    environment:
      POSTGRES_DB: teacheraid_dev
      POSTGRES_USER: teacheraid
      POSTGRES_PASSWORD: teacheraid
    ports:
      - "5432:5432"
    volumes:
      - teacheraid_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teacheraid -d teacheraid_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: teacheraid-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  teacheraid_pg_data:
