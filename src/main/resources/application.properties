# Phase 1.1 — Flyway owns schema. Redis and LLM stay off until later phases.
spring.application.name=teacheraid-backend

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:teacheraid_dev}
spring.datasource.username=${POSTGRES_USER:teacheraid}
spring.datasource.password=${POSTGRES_PASSWORD:teacheraid}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.port=8080
